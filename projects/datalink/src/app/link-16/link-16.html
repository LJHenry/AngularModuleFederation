<main class="main">
  <div class="content">
    <table mat-table [dataSource]="this.service.dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Message </th>
        <td mat-cell *matCellDef="let message"> {{message.id}} </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Type </th>
        <td mat-cell *matCellDef="let message"> {{message.type}} </td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let message"> {{message.data}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="this.service.displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: this.service.displayedColumns;"></tr>
    </table>
  </div>
</main>
