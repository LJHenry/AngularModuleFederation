<mat-toolbar-row class="toolbar">
  <span>
    <h2 class="title">OdiTTy Command</h2>
  </span>
</mat-toolbar-row>

<div class="tabsDivider">
  <mat-divider></mat-divider>
</div>

<!-- Borrowed geeksforgeeks code to create navigation tabs -->
<nav mat-tab-nav-bar mat-stretch-tabs="false" mat-align-tabs="start" [tabPanel]="tabPanel">
  @for (link of links; track link) {
  <a mat-tab-link (click)="activePath = link.path" [active]="link.path == activePath" [routerLink]="link.path">
    {{ link.label }}
  </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet (activate)="onActivate($event.path)"></router-outlet>
</mat-tab-nav-panel>
